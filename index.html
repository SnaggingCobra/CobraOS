<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="welcome-screen">
        <button id="start-button">Start CobraOS</button>
    </main>

    <div class="desktop">
        <header class="top-bar">
            <div class="os-name">CobraOS</div>
            <div class="clock" id="clock">00:00</div>
            <div class="date" id="date">Aug 12</div>
            <div class="system-status">

                <span>🔋 --%</span>
                <span>📶</span>
                <span>🔊</span>

        </div>
        </header>

    <div class="dock">

        <div class="dock-icon" id="files-icon">📁</div>
        <div class="dock-icon" id="browser-icon">🌐</div>
        <div class="dock-icon" id="notes-icon">📝</div>
        <div class="dock-icon" id="music-icon">🎵</div>
        <div class="dock-icon" id="images-icon">🖼️</div>
        <div class="dock-icon" id="settings-icon">⚙️</div>

    </div>
     
            <div class="app-window browser-window" id="browser-window">

            <div class="window-header" id="browser-header">

                <span>🌐 CobraOS Browser</span>

                <div class="window-controls">
                    <button id="browser-minimize">−</button>
                    <button id="browser-maximize">□</button>
                    <button id="browser-close">×</button>
                </div>

            </div>

            <div class="browser-toolbar">
                <button>←</button>
                <button>→</button>
                <button>↻</button>

                <input
                    type="text"
                    id="browser-url"
                    value="https://www.google.com"
                >

                <button id="browser-go">Go</button>
            </div>

            <div class="browser-content">
                <iframe
                    id="browser-frame"
                    src="https://www.google.com"
                    title="CobraOS Browser">
                </iframe>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
